set timeout=3
set default=0

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0

search --no-floppy --label SPRING-ESP --set=spring_esp
load_env --file=($spring_esp)/EFI/spring/grubenv

if background_image ($spring_esp)/EFI/spring/background.png; then
    set color_normal=light-gray/black
    set menu_color_normal=light-gray/black
    set menu_color_highlight=black/light-cyan
fi

for SLOT in $ORDER; do
    if [ "$SLOT" = "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" = "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" = "1" -a "$TRY" = "0" ]; then
        default=$INDEX
        break
    fi
done

save_env --file=($spring_esp)/EFI/spring/grubenv A_TRY A_OK B_TRY B_OK ORDER

menuentry "Spring Edge Slot A" --id spring-edge-a {
    search --no-floppy --label SPRING-ROOT-A --set=root
    linux /boot/vmlinuz root=PARTLABEL=SPRING-ROOT-A rw rootwait panic=60 quiet splash plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 rauc.slot=A
    initrd /boot/initrd.img
}

menuentry "Spring Edge Slot B" --id spring-edge-b {
    search --no-floppy --label SPRING-ROOT-B --set=root
    linux /boot/vmlinuz root=PARTLABEL=SPRING-ROOT-B rw rootwait panic=60 quiet splash plymouth.ignore-serial-consoles console=tty0 console=ttyS0,115200n8 rauc.slot=B
    initrd /boot/initrd.img
}
