[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spring-turret-demo"
version = "0.15.2"
description = "Minimal camera and fail-closed servo control service for Spring Edge"
requires-python = ">=3.12"
dependencies = [
  "dynamixel-sdk==4.0.5",
]

[project.scripts]
spring-turret = "spring_turret.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spring_turret = ["static/*", "w8a8_manifest.json"]
