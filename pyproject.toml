[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spring-turret-demo"
version = "0.1.0"
description = "Minimal camera and fail-closed servo control service for Spring Edge"
requires-python = ">=3.12"
dependencies = [
  "ftservo-python-sdk==2.0.0",
  "pyserial==3.5",
]

[project.scripts]
spring-turret = "spring_turret.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spring_turret = ["static/*"]
