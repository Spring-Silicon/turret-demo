<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Silicon + NVIDIA Jetson Thor · Turret Demo</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/dashboard.css">
  </head>
  <body>
    <section id="shared-controls" aria-label="Shared model and prompts">
      <p id="shared-message" role="status" hidden></p>
    </section>
    <main id="devices" aria-label="Spring Silicon and NVIDIA Jetson Thor demos"></main>
    <fieldset id="shared-gains">
      <legend>Servo gains · X/Y on both turrets</legend>
      <div class="axis-control">
        <div class="gain-heading"><label for="shared-p-gain">P</label>
          <input id="shared-p-value" type="number" min="1" max="16383" step="1" aria-label="P gain value for both turrets" placeholder="—" disabled>
        </div>
        <input id="shared-p-gain" type="range" min="1" max="2000" step="1" aria-label="P gain for X and Y on both turrets" disabled>
        <div class="gain-range" aria-hidden="true"><span>1</span><span id="shared-p-max">2000</span></div>
      </div>
      <div class="axis-control">
        <div class="gain-heading"><label for="shared-d-gain">D</label>
          <input id="shared-d-value" type="number" min="0" max="16383" step="1" aria-label="D gain value for both turrets" placeholder="—" disabled>
        </div>
        <input id="shared-d-gain" type="range" min="0" max="2000" step="1" aria-label="D gain for X and Y on both turrets" disabled>
        <div class="gain-range" aria-hidden="true"><span>0</span><span id="shared-d-max">2000</span></div>
      </div>
      <button id="shared-gains-reset" type="button" disabled>Reset P/D</button>
      <p id="shared-gains-message" role="status" hidden></p>
    </fieldset>
    <p id="dashboard-error" role="alert" hidden></p>
    <script src="/kiosk-ready.js"></script>
    <script src="/app.js"></script>
    <script src="/shared-controls.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
